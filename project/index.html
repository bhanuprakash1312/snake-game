<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        /* --- Setup & Styling --- */
        body {
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 2rem;
            color: #22c55e;
        }

        .score-board {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        canvas {
            background-color: #1e293b;
            border: 4px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .controls {
            margin-top: 1rem;
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div class="score-board">Score: <span id="score">0</span></div>
    
    <!-- Game Board -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="controls">Use <b>Arrow Keys</b> or <b>WASD</b> to move.</div>

    <!-- Game Engine Logic -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Grid configurations
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Game state
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1; // horizontal velocity
        let dy = 0; // vertical velocity
        let score = 0;
        let gameInterval;
        const gameSpeed = 250; // milliseconds per frame

        // Start engine
        function startGame() {
            placeFood();
            document.addEventListener("keydown", changeDirection);
            gameInterval = setInterval(updateGame, gameSpeed);
        }

        // Core game loop iteration
        function updateGame() {
            moveSnake();
            
            if (checkGameOver()) {
                clearInterval(gameInterval);
                alert(`Game Over! Your score: ${score}`);
                resetGame();
                return;
            }

            checkFoodCollision();
            drawGrid();
        }

        // Render snake and food
        function drawGrid() {
            // Clear canvas
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            ctx.fillStyle = "#22c55e"; // bright green
            snake.forEach((part, index) => {
                // Make the head a slightly darker green
                if (index === 0) ctx.fillStyle = "#15803d";
                else ctx.fillStyle = "#22c55e";
                
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw Food
            ctx.fillStyle = "#ef4444"; // red
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        // Advance snake forward
        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
            snake.pop(); // Remove tail unless it ate food
        }

        // Check arrow key inputs
        function changeDirection(event) {
            const key = event.key;
            
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if ((key === "ArrowLeft" || key === "a") && !goingRight) { dx = -1; dy = 0; }
            if ((key === "ArrowUp" || key === "w") && !goingDown) { dx = 0; dy = -1; }
            if ((key === "ArrowRight" || key === "d") && !goingLeft) { dx = 1; dy = 0; }
            if ((key === "ArrowDown" || key === "s") && !goingUp) { dx = 0; dy = 1; }
        }

        // Check if snake hits wall or itself
        function checkGameOver() {
            const head = snake[0];

            // Wall collisions
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }

            // Self collisions
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        // Check if head matches food coordinates
        function checkFoodCollision() {
            const head = snake[0];
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                
                // Grow snake body by duplicating last part
                const tail = { ...snake[snake.length - 1] };
                snake.push(tail);
                
                placeFood();
            }
        }

        // Spawn food at a random grid coordinate
        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Prevent food from spawning inside the snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    placeFood();
                }
            });
        }

        // Reset variables to restart cleanly
        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameInterval = setInterval(updateGame, gameSpeed);
        }

        // Run engine initialization
        startGame();
    </script>
</body>
</html>
